name: Deploy to EC2 (Self-Hosted Runner)

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted]

    env:
      # Path where crm folder exists on EC2
      CRM_DIR: /root/crm

    steps:
      - name: Pull latest code in EC2 backend and restart PM2
        run: |
          sudo su - << 'EOF'
          cd ${CRM_DIR}
          echo "Pulling latest code..."
          git pull
          echo "Restarting PM2 process..."
          pm2 restart 0 --update-env
          EOF

      - name: Build Frontend and Deploy to Nginx
        run: |
          sudo su - << 'EOF'
          cd ${CRM_DIR}/frontend
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          echo "Building frontend..."
          npm run build
          echo "Copying build to Nginx directory..."
          cp -r dist/* /var/www/crm-frontend/
          echo "Restarting Nginx..."
          systemctl restart nginx
          EOF
